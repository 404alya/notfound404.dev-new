# nginx config for @SITE_NAME@, written to out/nginx.conf by `./output.o --prod`
# from config/nginx.conf (edit that template, not out/nginx.conf;
# the SITE_NAME placeholder becomes site_name from main.c).
#
# Include it from the http block of nginx.conf:
#     include /path/to/project/out/nginx.conf;
# then set `root` and the certificate paths below and run `nginx -t`.
# nginx -t rejects the 443 listener until ssl_certificate is set.

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name @SITE_NAME@ www.@SITE_NAME@;
    return 301 https://@SITE_NAME@$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # nginx 1.25.1+
    server_name @SITE_NAME@;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # CHANGE ME: absolute path of the generated out/ directory.
    root /CHANGE/ME/out;

    charset utf-8; # text/html, plus:
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    # Every type the site serves, so responses don't depend on the host's
    # mime.types. A types block here replaces the inherited one.
    types {
        text/html              html;
        text/css               css;
        application/javascript js;
        application/json       json;
        text/plain             txt;
        image/svg+xml          svg;
        image/png              png;
        image/jpeg             jpg jpeg;
        image/webp             webp;
        image/x-icon           ico;
        font/woff2             woff2;
        font/ttf               ttf;
        video/webm             webm;
    }
    default_type application/octet-stream;

    # text/html is always compressed once gzip is on. Fonts, images and
    # videos are compressed already.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    error_page 404 /404.html;

    # Pages (and the 404 page) revalidate on every visit, so a rebuild shows
    # up at once; ETag and Last-Modified keep that cheap.
    add_header Cache-Control "no-cache" always;

    # This file sits in the web root.
    location = /nginx.conf {
        return 404;
    }

    # Fonts, images and videos. Their names carry no content hash (a video is
    # replaced under the same name), so 30 days rather than `immutable`.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # / and /article/: only an index.html, never a directory listing or 403.
    # (With `try_files $uri/`, /article/ would get 403 instead of the 404 page.)
    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # /articles serves articles.html too.
    location / {
        try_files $uri $uri.html =404;
    }
}
